<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071b3c" />
  <title>LGZ 2026 | Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--navy:#071b3c;--blue:#007dc5;--green:#8dc63e;--ink:#14223a;--muted:#68758b;--line:#e6ebf2;--paper:#f4f7fb;--white:#fff;--red:#d84747;--shadow:0 12px 35px rgba(7,27,60,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:'DM Sans',sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}h1,h2,h3,p{margin-top:0}h1,h2,h3,.brand-title{font-family:Manrope,sans-serif}.hidden{display:none!important}
    .topbar{height:72px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,64px);box-shadow:0 4px 18px #071b3c25}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--blue),#06467c);display:grid;place-items:center;color:#fff;font-family:Manrope;font-weight:800;font-size:13px;box-shadow:inset 0 0 0 1px #ffffff30}.brand-title{font-size:15px;font-weight:800;letter-spacing:.02em}.brand-sub{font-size:10px;color:#a9c6e0;letter-spacing:.13em;text-transform:uppercase;margin-top:3px}.top-right{display:flex;align-items:center;gap:14px}.eyebrow{color:#92b7d8;font-size:10px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}.pill{font-size:11px;background:#ffffff14;color:#cce8fa;border:1px solid #ffffff20;padding:7px 11px;border-radius:999px}.container{width:min(1160px,calc(100% - 36px));margin:32px auto 60px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.page-head h1{font-size:27px;margin:7px 0 5px;letter-spacing:-.04em}.subhead{font-size:13px;color:var(--muted);margin:0}.actions{display:flex;gap:9px;align-items:center}.btn{padding:11px 15px;border-radius:10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}.btn-primary{color:#fff;background:var(--blue);box-shadow:0 5px 14px #007dc533}.btn-primary:hover{background:#006bab;transform:translateY(-1px)}.btn-secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-secondary:hover{background:#f7f9fc}.btn-danger{background:#fff1f1;color:var(--red)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:19px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px 20px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:58px;height:58px;border-radius:50%;background:#007dc50b;right:-16px;top:-16px}.stat-label{color:var(--muted);font-size:11px;font-weight:600}.stat-value{font-family:Manrope;font-size:27px;letter-spacing:-.04em;font-weight:800;margin-top:7px}.stat-note{font-size:10px;color:#94a0b1;margin-top:3px}.main-grid{grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr);align-items:start}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:17px}.panel h2{font-size:15px;margin:0}.section-kicker{font-size:10px;color:var(--muted);margin-top:5px}.current{padding:17px;border-radius:13px;background:linear-gradient(115deg,#071b3c,#0a3c69);color:#fff;margin-bottom:17px;position:relative;overflow:hidden}.current:after{content:"";position:absolute;width:150px;height:150px;right:-40px;top:-65px;border:1px solid #ffffff22;border-radius:50%;box-shadow:0 0 0 18px #ffffff09,0 0 0 37px #ffffff07}.current-row{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;position:relative;z-index:1}.live-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#83c5ef;font-weight:700}.current h3{font-size:16px;margin:7px 0 4px}.current-meta{font-size:11px;color:#c1d5e6}.live-dot{width:8px;height:8px;background:#8dc63e;box-shadow:0 0 0 4px #8dc63e28;border-radius:50%;display:inline-block;margin-right:7px}.current-actions{display:flex;gap:7px;margin-top:15px;position:relative;z-index:1}.current-actions .btn{padding:8px 11px;font-size:10px}.current-actions .btn-secondary{background:#ffffff17;border-color:#ffffff30;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:9px;color:#8894a6;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line)}td{font-size:11px;padding:12px 10px;border-bottom:1px solid #f0f3f7}tbody tr:last-child td{border-bottom:0}.session-name{font-weight:700;color:#21324d}.subcell{font-size:10px;color:#8995a6;margin-top:4px}.status{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:5px 9px;border-radius:999px;font-weight:700}.status-active{background:#edfaef;color:#378b4a}.status-closed{background:#f1f3f6;color:#788497}.status-upcoming{background:#eaf5ff;color:#147ab3}.text-btn{color:var(--blue);font-weight:700;background:none;padding:0;font-size:10px}.empty{color:#8390a2;text-align:center;padding:30px 12px;font-size:12px}.side-list{display:grid;gap:10px}.quick{padding:13px;border:1px solid var(--line);border-radius:12px;display:flex;gap:12px;align-items:center}.quick-icon{width:35px;height:35px;border-radius:11px;background:#eaf5fc;color:var(--blue);display:grid;place-items:center;font-size:15px}.quick strong{font-size:11px;display:block}.quick small{font-size:10px;color:var(--muted);display:block;margin-top:4px}.login-card{width:min(430px,100%);margin:60px auto;padding:28px}.login-card h1{font-size:24px;margin-bottom:8px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:11px;font-weight:700;color:#3d4c62}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #dce3ed;border-radius:10px;background:#fff;font-size:13px;outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #007dc518}.message{font-size:11px;color:var(--red);min-height:16px;margin:6px 0}.modal-backdrop{position:fixed;inset:0;background:#071b3c77;display:grid;place-items:center;padding:18px;z-index:9}.modal{width:min(490px,100%);padding:24px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{margin:0;font-size:17px}.close{background:#eff3f8;color:#637087;width:31px;height:31px;border-radius:9px;font-size:17px}.qr-box{background:#f3f8fc;border:1px dashed #bdd7e9;border-radius:15px;min-height:230px;display:grid;place-items:center;margin:17px 0;padding:16px}.qr-box canvas,.qr-box img{max-width:100%}.url-box{font-size:10px;word-break:break-all;background:#f6f8fb;border-radius:8px;padding:9px;color:#5b6a80}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#10243f;color:#fff;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow);z-index:20;font-size:12px}.check-page{min-height:calc(100vh - 72px);display:grid;place-items:start center;padding:45px 18px}.check-card{width:min(470px,100%);padding:28px}.check-logo{text-align:center;margin-bottom:23px}.check-logo .brand-mark{margin:0 auto 11px}.check-title{text-align:center;font-size:23px;margin-bottom:7px}.check-intro{text-align:center;color:var(--muted);font-size:12px;line-height:1.55}.session-chip{background:#f0f7fc;border:1px solid #d8eaf6;border-radius:11px;padding:12px 14px;margin:19px 0}.session-chip small{font-size:9px;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.12em}.session-chip strong{display:block;margin-top:5px;font-size:13px}.check-result{text-align:center;padding:20px 5px}.result-icon{margin:0 auto 14px;width:54px;height:54px;border-radius:50%;background:#edfaef;color:#388b4b;display:grid;place-items:center;font-size:25px}.check-foot{text-align:center;color:#99a3b1;font-size:10px;margin-top:20px}.config-note{background:#fff8e7;color:#7d5b16;border:1px solid #f1dfa9;border-radius:9px;padding:10px 12px;font-size:11px;margin:0 0 15px}.filter{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:11px;color:#506076}.footer{text-align:center;font-size:10px;color:#a1aaba;margin-top:32px}
    @media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.main-grid{grid-template-columns:1fr}.side-panel{display:none}}@media(max-width:580px){.topbar{height:64px;padding:0 16px}.top-right .pill{display:none}.container{width:calc(100% - 24px);margin:22px auto 40px}.page-head{display:block}.page-head h1{font-size:23px}.page-head .actions{margin-top:15px}.page-head .btn{flex:1}.stats{gap:9px}.stat{padding:14px}.stat-value{font-size:23px}.panel{padding:14px}.table-wrap{margin:0 -5px}.top-right{gap:6px}.login-card{margin:35px auto;padding:22px}.check-card{padding:22px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="brand-mark">LGZ</div><div><div class="brand-title">LINDUNG Gen-Z Leaders Camp</div><div class="brand-sub">Attendance · 2026</div></div></div><div class="top-right"><span class="pill">PERKESO × UUM SBM</span><span class="eyebrow" id="topStatus">Programme dashboard</span></div></header>
  <main id="app"></main><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm';
    import QRCode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm';

    // Add the Supabase Project URL and publishable (anon) key here after setup.
    const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_PUBLISHABLE_KEY';
    const ready = SUPABASE_URL.startsWith('https://') && !SUPABASE_ANON_KEY.includes('YOUR_');
    const db = ready ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    const app = document.querySelector('#app');
    const modalRoot = document.querySelector('#modalRoot');
    const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dateFmt = value => new Intl.DateTimeFormat('en-MY',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kuala_Lumpur'}).format(new Date(value));
    const toast = message => { const el=document.querySelector('#toast'); el.textContent=message;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3000); };
    const configMessage = !ready ? '<div class="config-note">Setup is needed: add the Supabase project URL and publishable key in <b>index.html</b>, then deploy this folder.</div>' : '';
    let adminUser = null;

    function checkInPage(){
      const params=new URLSearchParams(location.search); const sessionId=params.get('session'); const token=params.get('token');
      app.innerHTML=`<section class="check-page"><div class="card check-card"><div class="check-logo"><div class="brand-mark">LGZ</div><div class="eyebrow" style="color:#60748e">PERKESO × UUM SBM</div></div><div id="checkContent"><h1 class="check-title">Activity check-in</h1><p class="check-intro">Enter your participant ID to record your attendance.</p><div class="session-chip"><small>Activity session</small><strong id="sessionTitle">Loading session…</strong></div><form id="checkForm"><div class="field"><label for="participantCode">Participant ID</label><input id="participantCode" required autocomplete="off" placeholder="e.g. LGZ-001" maxlength="40" /></div><p class="message" id="checkMessage"></p><button class="btn btn-primary" style="width:100%;padding:13px" type="submit">Confirm attendance</button></form><div class="check-foot">LINDUNG Gen-Z Leaders Camp 2026</div></div></div></section>`;
      if(!ready){document.querySelector('#sessionTitle').textContent='System not connected yet'; document.querySelector('#checkForm').classList.add('hidden');return;}
      if(!sessionId || !token){ document.querySelector('#sessionTitle').textContent='Invalid QR code';document.querySelector('#checkForm').classList.add('hidden');return; }
      db.rpc('get_public_session',{p_session_id:sessionId,p_qr_token:token}).then(({data,error})=>{if(error||!data?.ok){document.querySelector('#sessionTitle').textContent='This session is closed or unavailable';document.querySelector('#checkForm').classList.add('hidden');return;}document.querySelector('#sessionTitle').textContent=data.activity_label;});
      document.querySelector('#checkForm').addEventListener('submit',async e=>{e.preventDefault(); const btn=e.submitter;btn.disabled=true;btn.textContent='Checking…';const code=document.querySelector('#participantCode').value.trim();const {data,error}=await db.rpc('lgz_check_in',{p_session_id:sessionId,p_qr_token:token,p_participant_code:code});
        if(error||!data?.ok){document.querySelector('#checkMessage').textContent=data?.message||'We could not record this check-in. Check your ID and try again.';btn.disabled=false;btn.textContent='Confirm attendance';return;}
        const isDup=data.status==='already_recorded';document.querySelector('#checkContent').innerHTML=`<div class="check-result"><div class="result-icon">${isDup?'✓':'✓'}</div><h1 class="check-title">${isDup?'Already recorded':'You’re checked in'}</h1><p class="check-intro">${isDup?'Your attendance for this activity was already recorded.':'Your attendance has been recorded successfully.'}</p><div class="session-chip"><small>Activity session</small><strong>${esc(data.activity_label)}</strong></div><div class="check-foot">You can close this page now.</div></div>`;
      });
    }
    function loginPage(message=''){
      document.querySelector('#topStatus').textContent='Admin access';
      app.innerHTML=`<section class="login-card card">${configMessage}<div class="eyebrow" style="color:#007dc5">LGZ TEAM ACCESS</div><h1 style="margin-top:9px">Sign in to manage attendance</h1><p class="subhead">Use the administrator account created in Supabase.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required placeholder="name@example.com" /></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password" /></div><p class="message">${esc(message)}</p><button class="btn btn-primary" style="width:100%" type="submit" ${!ready?'disabled':''}>Sign in</button></form><p class="check-foot">Administrator accounts are managed by the LGZ system owner.</p></section>`;
      document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!db)return;const {data,error}=await db.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(error){loginPage('Sign-in failed. Check your email and password.');return;}adminUser=data.user;await dashboard();});
    }
    async function dashboard(){
      if(!ready){loginPage();return;}
      if(!adminUser){const {data}=await db.auth.getSession();adminUser=data.session?.user||null;}
      if(!adminUser){loginPage();return;}
      const {data:allowed,error:accessError}=await db.rpc('is_lgz_admin');
      if(accessError||!allowed){await db.auth.signOut();adminUser=null;loginPage('This account does not have LGZ administrator access.');return;}
      document.querySelector('#topStatus').textContent='Admin dashboard';
      app.innerHTML=`<div class="container"><div class="page-head"><div><div class="eyebrow" style="color:#007dc5">LGZ 2026 · PROGRAMME CONTROL</div><h1>Attendance dashboard</h1><p class="subhead">Live check-ins and attendance records for every activity.</p></div><div class="actions"><button class="btn btn-secondary" id="importBtn">＋ Import roster</button><button class="btn btn-primary" id="newSessionBtn">＋ New activity QR</button></div></div><section class="grid stats"><div class="card stat"><div class="stat-label">Registered participants</div><div class="stat-value" id="participantCount">—</div><div class="stat-note">In the LGZ roster</div></div><div class="card stat"><div class="stat-label">Attendance entries</div><div class="stat-value" id="attendanceCount">—</div><div class="stat-note">Across all activities</div></div><div class="card stat"><div class="stat-label">Activities tracked</div><div class="stat-value" id="sessionCount">—</div><div class="stat-note">QR attendance sessions</div></div><div class="card stat"><div class="stat-label">Live session</div><div class="stat-value" id="liveCount">—</div><div class="stat-note">Open check-in window</div></div></section><section class="grid main-grid"><div class="card panel"><div class="panel-head"><div><h2>Activity sessions</h2><div class="section-kicker">Create a separate QR for each activity.</div></div><button class="btn btn-secondary" id="refreshBtn">↻ Refresh</button></div><div id="liveSession"></div><div class="table-wrap"><table><thead><tr><th>Activity</th><th>Check-ins</th><th>Window</th><th>Status</th><th></th></tr></thead><tbody id="sessionsBody"></tbody></table></div></div><div class="card panel side-panel"><div class="panel-head"><div><h2>Quick actions</h2><div class="section-kicker">Manage the programme roster and reports.</div></div></div><div class="side-list"><div class="quick"><div class="quick-icon">▦</div><div><strong>Participant directory</strong><small id="directoryHint">Import a participant CSV roster</small></div></div><button class="quick" id="exportBtn" style="text-align:left;width:100%;background:#fff"><div class="quick-icon">⇩</div><div><strong>Export attendance CSV</strong><small>Download all session records</small></div></button><div class="quick"><div class="quick-icon">◷</div><div><strong>Check-in method</strong><small>Scan session QR · enter participant ID</small></div></div><button class="btn btn-secondary" id="signOutBtn" style="width:100%;margin-top:4px">Sign out</button></div></div></section><div class="footer">LINDUNG Gen-Z Leaders Camp 2026 · PERKESO × UUM SBM</div></div>`;
      document.querySelector('#newSessionBtn').onclick=createSessionModal;
      document.querySelector('#importBtn').onclick=importModal;
      document.querySelector('#refreshBtn').onclick=loadDashboard;
      document.querySelector('#exportBtn').onclick=exportAttendance;
      document.querySelector('#signOutBtn').onclick=async()=>{await db.auth.signOut();adminUser=null;loginPage();};
      await loadDashboard();
    }
    async function loadDashboard(){
      const [p,s,a]=await Promise.all([db.from('lgz_participants').select('id',{count:'exact',head:true}),db.from('lgz_sessions').select('*').order('created_at',{ascending:false}),db.from('lgz_attendance').select('session_id',{count:'exact'})]);
      if(p.error||s.error||a.error){toast('Could not load records. Check the database setup.');return;}
      const sessions=s.data||[];const attendance=a.data||[];const now=Date.now();const active=row=>row.is_open&&now>=new Date(row.starts_at).getTime()&&now<=new Date(row.closes_at).getTime();const live=sessions.find(active);
      document.querySelector('#participantCount').textContent=p.count??0;document.querySelector('#attendanceCount').textContent=a.count??0;document.querySelector('#sessionCount').textContent=sessions.length;document.querySelector('#liveCount').textContent=live?'1':'0';document.querySelector('#directoryHint').textContent=`${p.count??0} registered participant${p.count===1?'':'s'}`;
      const counts={};attendance.forEach(x=>counts[x.session_id]=(counts[x.session_id]||0)+1);
      const liveBox=document.querySelector('#liveSession');liveBox.innerHTML=live&&active(live)?`<div class="current"><div class="current-row"><div><div class="live-label"><span class="live-dot"></span>Live attendance</div><h3>${esc(live.activity_label)}</h3><div class="current-meta">${counts[live.id]||0} check-ins · Closes ${dateFmt(live.closes_at)}</div></div><div style="text-align:right"><div class="eyebrow">SESSION OPEN</div><div style="font-family:Manrope;font-weight:800;font-size:23px;margin-top:6px">${counts[live.id]||0}</div></div></div><div class="current-actions"><button class="btn btn-secondary" data-qr="${live.id}">Show QR code</button><button class="btn btn-secondary" data-close="${live.id}">Close check-in</button></div></div>`:'';
      liveBox.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>showQr(sessions.find(x=>x.id===b.dataset.qr)));
      liveBox.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSession(b.dataset.close));
      document.querySelector('#sessionsBody').innerHTML=sessions.length?sessions.map(row=>{const status=active(row)?'Open':row.is_open?'Expired':'Closed';return `<tr><td><div class="session-name">${esc(row.activity_label)}</div><div class="subcell">${dateFmt(row.starts_at)}</div></td><td><button class="text-btn" data-report="${row.id}">${counts[row.id]||0} · View</button></td><td>${esc(row.duration_label||'—')}</td><td><span class="status ${active(row)?'status-active':'status-closed'}">${status}</span></td><td>${active(row)?`<button class="text-btn" data-qr="${row.id}">QR code</button>`:row.is_open?`<button class="text-btn" data-close="${row.id}">Close</button>`:'<span class="subcell">—</span>'}</td></tr>`;}).join(''):'<tr><td colspan="5" class="empty">No activity sessions yet. Create the first QR code when you are ready.</td></tr>';
      document.querySelectorAll('#sessionsBody [data-qr]').forEach(b=>b.onclick=()=>showQr(sessions.find(x=>x.id===b.dataset.qr)));
      document.querySelectorAll('#sessionsBody [data-report]').forEach(b=>b.onclick=()=>attendanceModal(b.dataset.report,sessions.find(x=>x.id===b.dataset.report)?.activity_label||''));
      document.querySelectorAll('#sessionsBody [data-close]').forEach(b=>b.onclick=()=>closeSession(b.dataset.close));
    }
    function createSessionModal(){
      modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal card"><div class="modal-head"><h2>Start an activity check-in</h2><button class="close" data-close>×</button></div><p class="subhead">A unique QR code will be created for this activity. Only one session can be open at a time.</p><form id="sessionForm"><div class="field"><label>Activity name</label><input required name="activity" maxlength="100" placeholder="e.g. Inclusive Games: Blindfold Challenge" /></div><div class="field"><label>Check-in window</label><select name="minutes"><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="120">2 hours</option><option value="360">6 hours</option><option value="720">12 hours</option><option value="1440">24 hours</option></select></div><p class="message" id="modalMessage"></p><button class="btn btn-primary" style="width:100%">Create activity QR</button></form></div></div>`;
      modalRoot.querySelector('[data-close]').onclick=()=>modalRoot.innerHTML='';modalRoot.querySelector('.modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)modalRoot.innerHTML='';};
      modalRoot.querySelector('#sessionForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const minutes=Number(f.get('minutes'));const now=new Date(),end=new Date(now.getTime()+minutes*60000);const token=crypto.randomUUID()+crypto.randomUUID();await db.from('lgz_sessions').update({is_open:false}).eq('is_open',true);const {data,error}=await db.from('lgz_sessions').insert({activity_label:f.get('activity').trim(),qr_token:token,is_open:true,starts_at:now.toISOString(),closes_at:end.toISOString(),duration_label:minutes<60?`${minutes} min`:minutes<1440?`${minutes/60} hour${minutes>60?'s':''}`:'24 hours',created_by:adminUser.id}).select().single();if(error){modalRoot.querySelector('#modalMessage').textContent='Could not create this session. Check the database setup.';return;}modalRoot.innerHTML='';await loadDashboard();showQr(data);};
    }
    function showQr(session){
      if(!session)return;const link=new URL(location.href);link.search='';link.searchParams.set('session',session.id);link.searchParams.set('token',session.qr_token);
      modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal card"><div class="modal-head"><h2>Activity QR code</h2><button class="close" data-close>×</button></div><div class="eyebrow" style="color:#007dc5">${esc(session.activity_label)}</div><div class="qr-box" id="qr"></div><div class="url-box">${esc(link.href)}</div><div class="actions" style="margin-top:15px"><button class="btn btn-primary" id="downloadQr">Download QR image</button><button class="btn btn-secondary" id="copyLink">Copy check-in link</button></div><p class="check-foot">Display this QR at the activity location. It works until the check-in window closes or an administrator closes it.</p></div></div>`;
      modalRoot.querySelector('[data-close]').onclick=()=>modalRoot.innerHTML='';modalRoot.querySelector('.modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)modalRoot.innerHTML='';};
      QRCode.toCanvas(link.href,{width:210,margin:2,errorCorrectionLevel:'H',color:{dark:'#071b3c',light:'#ffffff'}},(err,canvas)=>{if(!err)modalRoot.querySelector('#qr').append(canvas);});
      modalRoot.querySelector('#downloadQr').onclick=()=>{const c=modalRoot.querySelector('#qr canvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`LGZ-${session.activity_label.replace(/[^a-z0-9]+/gi,'-').slice(0,35)}-QR.png`;a.click();};
      modalRoot.querySelector('#copyLink').onclick=async()=>{await navigator.clipboard.writeText(link.href);toast('Check-in link copied.');};
    }
    async function closeSession(id){if(!confirm('Close this activity check-in now? The QR will stop accepting attendance.'))return;const {error}=await db.from('lgz_sessions').update({is_open:false}).eq('id',id);if(error)toast('Could not close this session.');else{toast('Check-in closed.');loadDashboard();}}
    async function attendanceModal(sessionId,title){const {data,error}=await db.from('lgz_attendance_view').select('participant_code,full_name,affiliation,checked_in_at').eq('session_id',sessionId).order('checked_in_at',{ascending:true});if(error){toast('Could not load attendance records.');return;}modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal card" style="width:min(720px,100%)"><div class="modal-head"><div><h2>${esc(title)}</h2><div class="section-kicker">${data.length} participant check-ins</div></div><button class="close" data-close>×</button></div><div class="table-wrap"><table><thead><tr><th>Participant ID</th><th>Name</th><th>Affiliation</th><th>Checked in</th></tr></thead><tbody>${data.length?data.map(x=>`<tr><td>${esc(x.participant_code)}</td><td>${esc(x.full_name)}</td><td>${esc(x.affiliation)}</td><td>${dateFmt(x.checked_in_at)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No check-ins recorded for this activity.</td></tr>'}</tbody></table></div></div></div>`;modalRoot.querySelector('[data-close]').onclick=()=>modalRoot.innerHTML='';modalRoot.querySelector('.modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)modalRoot.innerHTML='';};}
    function importModal(){
      modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal card"><div class="modal-head"><h2>Import participant roster</h2><button class="close" data-close>×</button></div><p class="subhead">Upload a CSV containing these columns: <b>participant_code, full_name, affiliation</b>. Participant code must be unique. Affiliation is optional.</p><div class="field"><label>Participant CSV file</label><input type="file" id="rosterFile" accept=".csv,text/csv" /></div><p class="message" id="modalMessage"></p><button class="btn btn-primary" id="uploadRoster" style="width:100%">Import roster</button><button class="btn btn-secondary" id="templateCsv" style="width:100%;margin-top:9px">Download CSV template</button></div></div>`;
      modalRoot.querySelector('[data-close]').onclick=()=>modalRoot.innerHTML='';modalRoot.querySelector('.modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)modalRoot.innerHTML='';};
      modalRoot.querySelector('#templateCsv').onclick=()=>download('lgz-roster-template.csv','participant_code,full_name,affiliation\nLGZ-001,Example Participant,UUM\n');
      modalRoot.querySelector('#uploadRoster').onclick=async()=>{const file=modalRoot.querySelector('#rosterFile').files[0];if(!file){modalRoot.querySelector('#modalMessage').textContent='Choose a CSV file first.';return;}try{const rows=parseCsv(await file.text());const headers=rows.shift().map(x=>x.trim().toLowerCase());const ci=headers.indexOf('participant_code'),ni=headers.indexOf('full_name'),ai=headers.indexOf('affiliation');if(ci<0||ni<0)throw Error('CSV needs participant_code and full_name columns.');const batch=rows.filter(r=>r[ci]?.trim()&&r[ni]?.trim()).map(r=>({participant_code:r[ci].trim(),full_name:r[ni].trim(),affiliation:ai<0?'':(r[ai]||'').trim()}));if(!batch.length)throw Error('No participant rows found.');let imported=0;for(let i=0;i<batch.length;i+=300){const {error}=await db.from('lgz_participants').upsert(batch.slice(i,i+300),{onConflict:'participant_code'});if(error)throw Error('Import failed. Check that participant_code is unique and the database is set up.');imported+=batch.slice(i,i+300).length;}modalRoot.innerHTML='';toast(`${imported} participant records imported.`);loadDashboard();}catch(err){modalRoot.querySelector('#modalMessage').textContent=err.message;}};
    }
    async function exportAttendance(){const {data,error}=await db.from('lgz_attendance_view').select('*').order('checked_in_at',{ascending:false});if(error){toast('Could not export attendance records.');return;}const rows=[['participant_code','full_name','affiliation','activity','checked_in_at'],...(data||[]).map(x=>[x.participant_code,x.full_name,x.affiliation,x.activity_label,x.checked_in_at])];download('lgz-2026-attendance.csv',rows.map(row=>row.map(csvCell).join(',')).join('\r\n'));toast('Attendance CSV downloaded.');}
    function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(ch==='"')quoted=false;else cell+=ch;}else if(ch==='"')quoted=true;else if(ch===','){row.push(cell);cell='';}else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}else cell+=ch;}if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row);}return rows.filter(r=>r.some(v=>v.trim()));}
    const csvCell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';function download(name,text){const blob=new Blob([text],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);}
    if(new URLSearchParams(location.search).has('session'))checkInPage();else dashboard();
  </script>
</body>
</html>
